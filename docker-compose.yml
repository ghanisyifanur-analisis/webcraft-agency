version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. LARAVEL APPLICATION SERVICE (PHP 8.2 + Artisan Server)
  # -------------------------------------------------------------
  laravel_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webcraft_laravel_app
    restart: always
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:c5Y7bLz8QxYv5WqPzR2sT4vU8xY1a3b5c7d9e1f3g5h=
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_DATABASE=webcraft_db
      - DB_USERNAME=webcraft_user
      - DB_PASSWORD=webcraft_secret
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - laravel-net
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  # -------------------------------------------------------------
  # 2. POSTGRESQL DATABASE SERVICE (PostgreSQL 15 Alpine)
  # -------------------------------------------------------------
  postgres_db:
    image: postgres:15-alpine
    container_name: webcraft_postgres_db
    restart: always
    environment:
      POSTGRES_DB: webcraft_db
      POSTGRES_USER: webcraft_user
      POSTGRES_PASSWORD: webcraft_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webcraft_user -d webcraft_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - laravel-net

# -------------------------------------------------------------
# DOCKER NETWORKS & PERSISTENT VOLUMES
# -------------------------------------------------------------
networks:
  laravel-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
